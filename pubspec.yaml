
  name: plantfix
  description: "plantfix your crop doctor"
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.13.2

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^1.0.8
    image_picker: ^1.1.2
    http: ^1.5.0
    shared_preferences: ^2.5.3

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

  flutter:
    uses-material-design: true

    assets:
      - assets/images/

  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/applogo.jpeg"

